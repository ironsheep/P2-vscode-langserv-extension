services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    # Name the built image so Docker reuses the cached layers across rebuilds.
    image: spin2-langserv-dev:local
    volumes:
      # Mount the REPO ROOT, not just spin2/, so .git is visible inside the
      # container and git operations work. devcontainer.json still opens
      # spin2/ as the workspace folder — nothing is reorganized, the mount is
      # simply wider than the folder you work in.
      - ../..:/workspaces/P2-vscode-langserv-extension:cached
      # Persist todo-mcp task data across container rebuilds.
      - todo-mcp-data:/home/node/.local/share/todo-mcp
    ports:
      # Host-side ports are unique fleet-wide (PNut-TS holds 5001/9125,
      # PNut-Term-TS 5003/9124, PNut-Term-TS-MASTER 5002/9123).
      # Container-side keeps the LSP's original debug-attach ports.
      - "5004:5001"
      - "9126:9123"
    command: sleep infinity
    # Note: postCreateCommand, extensions, and settings are handled in
    # devcontainer.json, not here. Tooling (pnut-ts, Claude CLI, vsce) is
    # baked into the image via Dockerfile.

volumes:
  todo-mcp-data:
